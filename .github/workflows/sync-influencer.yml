name: Sync influencer data from Google Sheets

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install google-api-python-client google-auth

      - name: Fetch live sheet data and rebuild aggregates
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa-key.json
        run: |
          echo '${{ secrets.GOOGLE_SA_KEY }}' > /tmp/sa-key.json
          python3 pipeline/sync_live_influencer.py
          rm -f /tmp/sa-key.json

      - name: Commit and push if changed
        run: |
          if git diff --quiet data/summary.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/summary.json
          git commit -m "Sync influencer data from Google Sheets"
          git push
